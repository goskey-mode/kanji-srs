<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>かんじれんしゅう</title>
<link rel="stylesheet" href="common.css">
<style>
  /* タブレットの表示領域 570×584 に、スクロールなしで1問が収まること */
  #app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 14px; flex: none; }
  .bar .grow { flex: 1; }
  .prog { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--accent); }
  .main { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 12px; padding: 12px 20px; text-align: center; overflow: auto; }
  .foot { flex: none; padding: 0 16px 16px; display: flex; gap: 12px; justify-content: center; }
  .big { min-height: 64px; min-width: 240px; font-size: 22px; border-radius: 14px; }
  .streak { font-size: 44px; font-weight: 700; line-height: 1.1; }
  .streak small { display: block; font-size: 15px; font-weight: 400; color: var(--muted); margin-top: 6px; }
  .today { font-size: 18px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .sentence { font-size: clamp(24px, 6vw, 36px); line-height: 1.7; font-weight: 500; word-break: break-all; }
  .sentence.long { font-size: clamp(20px, 4.6vw, 28px); }
  .sentence mark { background: var(--hl); color: var(--hl-text); padding: 0 6px; border-radius: 6px; font-weight: 700; }
  .hint { color: var(--muted); font-size: 15px; }
  .answer { font-size: clamp(40px, 11vw, 64px); font-weight: 700; line-height: 1.15; word-break: break-all; }
  .answer.long { font-size: clamp(22px, 5vw, 30px); font-weight: 600; }
  .reading { font-size: 20px; color: var(--muted); }
  .explain { font-size: 16px; max-width: 520px; text-align: left; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 12px; white-space: pre-wrap; }
  .photo { max-width: 100%; max-height: 42vh; max-height: 42dvh; object-fit: contain; border: 1px solid var(--line); border-radius: 8px; cursor: zoom-in; }
  .photo-wait { width: 100%; max-width: 480px; height: 34vh; display: flex; align-items: center; justify-content: center;
    border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); }
  .grade { flex: 1; min-height: 72px; max-width: 180px; border-radius: 14px; border: 2px solid; background: var(--panel);
    font-size: 19px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; }
  .grade span { font-size: 28px; }
  .g-o { color: var(--ok); border-color: var(--ok); }
  .g-t { color: var(--mid); border-color: var(--mid); }
  .g-x { color: var(--ng); border-color: var(--ng); }
  .score { font-size: 20px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { min-width: 88px; min-height: 44px; border: 0; background: var(--panel); color: var(--muted); font-size: 16px; }
  .seg button.on { background: var(--accent); color: var(--accent-text); font-weight: 700; }
  @media (max-height: 480px) {
    .big { min-height: 52px; font-size: 19px; }
    .grade { min-height: 60px; }
    .streak { font-size: 36px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status"></div>
<script src="api.js"></script>
<script>
(function () {
  'use strict';
  var h = KS.h;
  var app = document.getElementById('app');
  var KEY_PIN = 'kanjisrs_study_pin';
  var KEY_OUTBOX = 'kanjisrs_outbox';
  var KEY_FINISH = 'kanjisrs_pending_finish';
  var BLANK = '（　　）'; // 穴埋め問題の空欄
  var KEY_DIR = 'kanjisrs_challenge_dir';
  var DIRS = [['write', '書き'], ['read', '読み'], ['mix', 'まぜる']];

  var state = {
    pin: KS.load(KEY_PIN) || '',
    today: null,       // getToday の結果
    cards: [],
    idx: 0,
    shownAt: 0,
    results: [],       // {card, result}
    startedAt: 0,
    practice: [],
    photos: {}         // 写真URL -> 先読み中の Image
  };

  // ───── 送信待ち（端末に保存して、まとめて裏で送る） ─────
  function outbox() { return KS.loadJson(KEY_OUTBOX, []); }
  var flushing = null;
  function flush(opts) {
    if (flushing) return flushing;
    var list = outbox();
    if (!list.length) return Promise.resolve();
    flushing = KS.call('submitReviews', state.pin, [list], opts).then(function () {
      // 送っている間に増えた分は残す
      var sent = {};
      list.forEach(function (r) { sent[r.review_id] = true; });
      KS.storeJson(KEY_OUTBOX, outbox().filter(function (r) { return !sent[r.review_id]; }));
    }).finally(function () { flushing = null; renderSync(); });
    return flushing;
  }
  function sendPendingFinish() {
    var p = KS.loadJson(KEY_FINISH, null);
    if (!p) return Promise.resolve(null);
    return KS.call('finishDay', state.pin, [p]).then(function (s) { KS.remove(KEY_FINISH); return s; });
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') flush({ keepalive: true }).catch(function () { /* 次回再送 */ });
  });

  function syncLabel() {
    var n = outbox().length;
    return n ? '送信待ち ' + n + '件' : '';
  }
  function renderSync() {
    var el = document.getElementById('sync');
    if (el) el.textContent = syncLabel();
  }

  // ───── 写真の先読み（署名付きURLをブラウザに読ませておく。端末のキャッシュが効く） ─────
  function prefetch(cards) {
    cards.forEach(function (c) {
      [c.photo_q_url, c.photo_a_url].forEach(function (url) {
        if (url && !state.photos[url]) { state.photos[url] = new Image(); state.photos[url].src = url; }
      });
    });
  }
  function photoEl(url) {
    var box = h('div', { class: 'photo-wait', text: '写真をよみこみ中…' });
    var img = h('img', { class: 'photo', src: url, alt: '問題の写真', onclick: function () { zoom(url); } });
    img.addEventListener('load', function () { if (box.parentNode) box.replaceWith(img); });
    img.addEventListener('error', function () { box.textContent = '写真をよみこめませんでした'; });
    if (img.complete && img.naturalWidth) return img;
    return box;
  }
  function zoom(url) {
    var ov = h('div', { class: 'overlay', onclick: function () { ov.remove(); } }, [h('img', { src: url, alt: '拡大' })]);
    document.body.appendChild(ov);
  }

  // ───── 画面 ─────
  function setScreen(barChildren, mainChildren, footChildren) {
    var nodes = [h('div', { class: 'bar' }, barChildren), h('div', { class: 'main' }, mainChildren)];
    if (footChildren) nodes.push(h('div', { class: 'foot' }, footChildren));
    app.replaceChildren.apply(app, nodes);
  }

  function showSetup(msg) {
    var needApi = !KS.validApi(KS.getApi());
    var apiIn = h('input', { class: 'input', type: 'url', placeholder: 'https://kanji-srs.…workers.dev/api', value: KS.getApi() });
    var pinIn = h('input', { class: 'input', type: 'password', inputmode: 'numeric', autocomplete: 'off', placeholder: 'PIN' });
    var btn = h('button', { class: 'btn', text: 'はじめる', onclick: function () {
      if (needApi && !KS.setApi(apiIn.value.trim())) { KS.toast('接続先URLの形がちがいます', 'error'); return; }
      var pin = pinIn.value.trim();
      btn.disabled = true;
      KS.call('whoami', pin).then(function () {
        state.pin = pin;
        KS.store(KEY_PIN, pin);
        start();
      }, function (e) { btn.disabled = false; KS.toast(KS.message(e), 'error'); });
    } });
    app.replaceChildren(h('div', { class: 'setup' }, [
      h('h1', { text: 'かんじれんしゅう' }),
      msg ? h('div', { class: 'ng', text: msg }) : null,
      needApi ? h('label', { class: 'field' }, ['接続先（親が設定）', apiIn]) : null,
      h('label', { class: 'field' }, ['PIN', pinIn]),
      btn
    ]));
    (needApi ? apiIn : pinIn).focus();
  }

  function showLoading(text) {
    setScreen([h('span', { text: 'かんじれんしゅう' })], [h('div', { class: 'hint', text: text || 'よみこみ中…' })]);
  }

  function showError(e, retry) {
    setScreen([h('span', { text: 'かんじれんしゅう' })], [
      h('div', { class: 'ng', text: KS.message(e) }),
      h('button', { class: 'btn big', text: 'もう一度', onclick: retry })
    ]);
  }

  function start() {
    if (!KS.validApi(KS.getApi()) || !state.pin) { showSetup(); return; }
    showLoading();
    // 前回の送信待ち → 前回の「おわり」→ 今日の問題、の順（サーバーの状態を最新にしてから読む）
    flush().catch(function () {}).then(sendPendingFinish).catch(function () {}).then(function () {
      return KS.call('getToday', state.pin);
    }).then(function (t) {
      state.today = t;
      state.cards = t.cards;
      prefetch(t.cards);
      showHome();
    }, function (e) {
      if (/BAD_PIN|FORBIDDEN/.test(String(e.message))) { KS.remove(KEY_PIN); state.pin = ''; showSetup(KS.message(e)); return; }
      showError(e, start);
    });
  }

  function showHome() {
    var t = state.today;
    var n = t.cards.length;
    var mins = Math.max(1, Math.round(t.estSeconds / 60));
    var main = [
      h('div', { class: 'streak' }, ['🔥 ' + t.streak + '日', h('small', { text: 'れんぞく（お休みチケット のこり' + t.freezesLeft + 'まい）' })])
    ];
    if (t.done || !n) {
      main.push(h('div', { class: 'today', text: '今日の分はおわり！' }));
      // 終わったあとも、同じ日に何度でも取り組める
      var extra = t.extra || [], practice = t.practice || [];
      if (extra.length) {
        main.push(h('button', { class: 'btn big', onclick: function () { beginSession(extra); } },
          ['つづきをやる（' + extra.length + '問・やく' + Math.max(1, Math.round(t.extraEstSeconds / 60)) + '分）']));
      }
      if (practice.length) {
        main.push(h('button', { class: 'btn ' + (extra.length ? 'ghost' : 'big'), onclick: function () { beginPractice(practice, 'home'); } },
          ['今日の問題をもう一回（' + practice.length + '問・きろくなし）']));
      }
    } else {
      main.push(h('div', { class: 'today' }, ['今日のまちがえた問題 ', h('b', { text: n + '問' }), '（やく ' + mins + '分）']));
      main.push(h('button', { class: 'btn big', text: 'はじめる', onclick: function () { beginSession(t.cards); } }));
    }
    // 新しい問題は、時間があるときにいつでも（10分の枠や連続日数とは別）
    main.push(h('button', { class: 'btn ghost', text: '新しい問題にチャレンジ', onclick: showDecks }));
    var fresh = t.cards.filter(function (c) { return c.stage === 0 && c.state === 'learning'; }).length;
    main.push(h('div', { class: 'chips' }, [
      h('span', { class: 'chip', text: '卒業した問題 ' + t.graduated }),
      n ? h('span', { class: 'chip', text: 'はじめての問題 ' + fresh }) : null
    ]));
    setScreen([h('span', { text: 'かんじれんしゅう' }), h('span', { class: 'grow' }), h('span', { id: 'sync', class: 'muted', text: syncLabel() })], main);
  }

  // mode: 'daily'（まちがえた問題の復習）/ 'new'（新しい問題のチャレンジ）
  function beginSession(list, mode) {
    state.mode = mode || 'daily';
    state.cards = list;
    state.idx = 0;
    state.results = [];
    state.startedAt = Date.now();
    showQuestion();
  }

  // 記録しない練習。home: ホームの「今日の問題をもう一回」から / done: おわりの画面の「×の問題をもう一回」から
  function beginPractice(list, from) {
    state.practice = list;
    state.practiceFrom = from;
    state.idx = 0;
    showQuestion(true);
  }

  // ───── 新しい問題のチャレンジ ─────
  function showDecks() {
    showLoading();
    KS.call('getChallengeDecks', state.pin).then(function (decks) {
      var main = [h('div', { class: 'today', text: '新しい問題にチャレンジ' })];
      if (!decks.length) {
        main.push(h('div', { class: 'hint', text: 'いまチャレンジできる問題はありません' }));
      } else {
        main.push(h('div', { class: 'hint', text: 'できた問題はおぼえたことに、まちがえた問題は復習に入ります' }));
        // 書きだけ・読みだけ・まぜる（前回の選択を覚えておく）。漢字以外の問題はどれでも出る
        var dir = KS.load(KEY_DIR) || 'mix';
        var count = function (d) { return dir === 'write' ? d.write + d.single : dir === 'read' ? d.read + d.single : d.n; };
        main.push(h('div', { class: 'seg' }, DIRS.map(function (x) {
          return h('button', { class: x[0] === dir ? 'on' : '', text: x[1], onclick: function () { KS.store(KEY_DIR, x[0]); showDecks(); } });
        })));
        decks.forEach(function (d) {
          var n = count(d);
          main.push(h('button', { class: 'btn big', disabled: !n, onclick: function () { beginChallenge(d.deck); } }, [d.deck + '（のこり ' + n + '問）']));
        });
      }
      main.push(h('button', { class: 'btn ghost', text: 'もどる', onclick: start }));
      setScreen([h('span', { text: 'チャレンジ' }), h('span', { class: 'grow' }), h('span', { id: 'sync', class: 'muted', text: syncLabel() })], main);
    }, function (e) { showError(e, showDecks); });
  }

  function beginChallenge(deck) {
    state.deck = deck;
    showLoading();
    KS.call('getChallenge', state.pin, [deck, 10, KS.load(KEY_DIR) || 'mix']).then(function (cards) {
      if (!cards.length) { showDecks(); return; }
      prefetch(cards);
      beginSession(cards, 'new');
    }, function (e) { showError(e, function () { beginChallenge(deck); }); });
  }

  function finishChallenge() {
    showLoading('きろくしています…');
    flush().catch(function () { /* 送れなかった分は次に開いたとき送る */ }).then(showChallengeDone);
  }

  function showChallengeDone() {
    var ok = state.results.filter(function (r) { return r.result === 'o'; }).length;
    var wrong = state.results.filter(function (r) { return r.result !== 'o'; }).map(function (r) { return r.card; });
    var main = [
      h('div', { class: 'streak' }, ['✨', h('small', { text: 'チャレンジおわり！' })]),
      h('div', { class: 'score', text: 'おぼえてた ' + ok + '問　／　復習に入れた ' + wrong.length + '問' })
    ];
    if (wrong.length) {
      main.push(h('button', { class: 'btn ghost', text: 'まちがえた' + wrong.length + '問をもう一回（きろくなし）', onclick: function () {
        beginPractice(wrong, 'challenge');
      } }));
    }
    main.push(h('button', { class: 'btn big', text: 'つづけてチャレンジ', onclick: function () { beginChallenge(state.deck); } }));
    main.push(h('button', { class: 'btn ghost', text: 'はじめの画面へ', onclick: start }));
    setScreen([h('span', { text: 'チャレンジ' }), h('span', { class: 'grow' }), h('span', { id: 'sync', class: 'muted', text: syncLabel() })], main);
  }

  function progressBar(label) {
    var pct = Math.round(state.idx / state.cards.length * 100);
    return [h('span', { text: (state.idx + 1) + ' / ' + state.cards.length }),
      h('div', { class: 'prog' }, [h('i', { style: 'width:' + pct + '%' })]),
      h('span', { class: 'chip', text: (state.mode === 'new' ? 'チャレンジ・' : '') + label })];
  }

  function cardLabel(c) {
    if (KS.isKanji(c)) return c.direction === 'write' ? '書き' : '読み';
    return c.unit || c.subject || '問題';
  }

  function sentenceEl(c, forAnswer) {
    var p = KS.promptParts(c);
    var long = (c.sentence || '').length > 18;
    var mark = forAnswer ? c.answer : p.mark;
    return h('div', { class: 'sentence' + (long ? ' long' : '') }, [p.before, h('mark', { text: mark }), p.after]);
  }

  function showQuestion(practice) {
    var list = practice ? state.practice : state.cards;
    var c = list[state.idx];
    state.shownAt = Date.now();
    var main = [];
    if (KS.isKanji(c)) {
      main.push(sentenceEl(c, false));
      main.push(h('div', { class: 'hint', text: c.direction === 'write' ? '紙に書いてから押してね' : 'よみを紙に書いてから押してね' }));
    } else {
      if (c.photo_q_url) main.push(photoEl(c.photo_q_url));
      if (c.sentence) main.push(h('div', { class: 'sentence' + (c.sentence.length > 18 ? ' long' : ''), text: c.sentence }));
      // 穴埋め（作文の表現など）
      if (c.sentence && c.sentence.indexOf(BLANK) >= 0) main.push(h('div', { class: 'hint', text: '（　　）に入ることばを紙に書いてから押してね' }));
      var meta = [c.source, c.qno, c.reason ? '理由: ' + c.reason : ''].filter(Boolean).join('・');
      if (meta) main.push(h('div', { class: 'hint', text: meta }));
      if (c.type === 'C') main.push(h('div', { class: 'hint', text: 'どこでまちがえたか、思い出してから押してね' }));
    }
    main.push(h('button', { class: 'btn big', text: '答えを見る', onclick: function () { showAnswer(practice); } }));
    var bar = practice
      ? [h('span', { text: 'もう一回 ' + (state.idx + 1) + ' / ' + list.length }), h('span', { class: 'grow' }), h('span', { class: 'chip', text: 'れんしゅう' })]
      : progressBar(cardLabel(c));
    setScreen(bar, main);
  }

  function showAnswer(practice) {
    var list = practice ? state.practice : state.cards;
    var c = list[state.idx];
    var main = [];
    if (KS.isKanji(c)) {
      var p = KS.promptParts(c);
      main.push(h('div', { class: 'hint' }, [p.before, h('b', { text: c.answer }), p.after]));
      if (c.direction === 'write') {
        main.push(h('div', { class: 'answer', text: c.answer }));
        main.push(h('div', { class: 'reading', text: c.reading }));
      } else {
        main.push(h('div', { class: 'answer', text: c.reading }));
        main.push(h('div', { class: 'reading', text: c.answer }));
      }
    } else {
      if (c.photo_a_url) main.push(photoEl(c.photo_a_url));
      if (c.answer) main.push(h('div', { class: 'answer' + (c.answer.length > 8 ? ' long' : ''), text: c.answer }));
      // 穴埋めは、答えを入れた文も見せて使い方ごと覚える
      if (c.answer && c.sentence && c.sentence.indexOf(BLANK) >= 0) {
        var at = c.sentence.indexOf(BLANK);
        main.push(h('div', { class: 'hint' }, [c.sentence.slice(0, at), h('b', { text: c.answer }), c.sentence.slice(at + BLANK.length)]));
      }
    }
    // 漢字の問題の解説は、その単語の意味として表示する
    if (c.explanation) main.push(h('div', { class: 'explain', text: (KS.isKanji(c) ? 'いみ：' : c.type === 'C' ? 'ポイント: ' : '') + c.explanation }));

    var foot;
    if (practice) {
      foot = [h('button', { class: 'btn big', text: state.idx + 1 < list.length ? 'つぎへ' : 'おわる', onclick: function () {
        state.idx++;
        if (state.idx < list.length) showQuestion(true);
        else if (state.practiceFrom === 'home') start();
        else if (state.practiceFrom === 'challenge') showChallengeDone();
        else showDone();
      } })];
    } else {
      var grade = function (r) {
        return function () { record(c, r); };
      };
      foot = [
        h('button', { class: 'grade g-o', onclick: grade('o') }, [h('span', { text: '○' }), 'できた']),
        h('button', { class: 'grade g-t', onclick: grade('t') }, [h('span', { text: '△' }), 'おしい']),
        h('button', { class: 'grade g-x', onclick: grade('x') }, [h('span', { text: '×' }), 'まちがえた'])
      ];
    }
    var bar = practice
      ? [h('span', { text: 'もう一回 ' + (state.idx + 1) + ' / ' + list.length }), h('span', { class: 'grow' }), h('span', { class: 'chip', text: 'れんしゅう' })]
      : progressBar(cardLabel(c));
    setScreen(bar, main, foot);
  }

  function record(c, result) {
    var list = outbox();
    list.push({
      review_id: KS.uuid(), card_id: c.card_id, result: result,
      answered_at: new Date().toISOString(),
      duration_sec: Math.min(600, Math.round((Date.now() - state.shownAt) / 1000)),
      mode: state.mode
    });
    KS.storeJson(KEY_OUTBOX, list);
    state.results.push({ card: c, result: result });
    if (list.length >= 5) flush().catch(function () { /* 次の区切りか次回に再送 */ });
    state.idx++;
    if (state.idx < state.cards.length) showQuestion();
    else if (state.mode === 'new') finishChallenge();
    else finish();
  }

  function finish() {
    var seconds = Math.round((Date.now() - state.startedAt) / 1000);
    var info = { day: state.today.today, cards_done: state.results.length, seconds: seconds };
    KS.storeJson(KEY_FINISH, info);
    state.finishStreak = null;
    showLoading('きろくしています…');
    flush().then(sendPendingFinish).then(function (s) {
      state.finishStreak = s;
    }).catch(function () { /* 送れなかった分は次に開いたとき送る */ }).then(showDone);
  }

  function showDone() {
    var count = { o: 0, t: 0, x: 0 };
    state.results.forEach(function (r) { count[r.result]++; });
    state.practice = state.results.filter(function (r) { return r.result === 'x'; }).map(function (r) { return r.card; });
    var s = state.finishStreak;
    var main = [
      h('div', { class: 'streak' }, [s ? '🔥 ' + s.streak + '日' : '🎉', h('small', { text: s ? '今日の分おわり！' : '今日の分おわり！（きろくは次に開いたときに送ります）' })]),
      h('div', { class: 'score', text: '○ ' + count.o + '　△ ' + count.t + '　× ' + count.x })
    ];
    if (state.practice.length) {
      main.push(h('button', { class: 'btn big', text: '×の' + state.practice.length + '問をもう一回', onclick: function () {
        beginPractice(state.practice, 'done');
      } }));
      main.push(h('div', { class: 'hint', text: 'もう一回はれんしゅうなので、きろくには入りません' }));
    }
    main.push(h('button', { class: 'btn ghost', text: 'はじめの画面へ', onclick: start }));
    setScreen([h('span', { text: 'おわり' }), h('span', { class: 'grow' }), h('span', { id: 'sync', class: 'muted', text: syncLabel() })], main);
  }

  start();
})();
</script>
</body>
</html>
